services:
  postgres:
    image: postgres:15
    container_name: web_postgres
    restart: always
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: monitor
      POSTGRES_DB: monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"  # Opcional, para acessar com ferramentas externas (ex: pgAdmin)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./BackEnd
    volumes:
      - ./BackEnd/app:/app/app   # Hot Reload
    env_file:
      - path: ./BackEnd/.env     # carrega TEAMS_WEBHOOK_URL e PANEL_PASSWORD
        required: false          # não quebra se o arquivo não existir na VM
    environment:
      - DATABASE_URL=postgresql://monitor:monitor@postgres:5432/monitor
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    depends_on:
      postgres:
        condition: service_healthy
    # A porta 5000 não precisa ser exposta no host, pois o Nginx acessa internamente.
    # Mas manter exposta permite testar diretamente via localhost:5000
    ports:
      - "5000:5000"

  frontend:
    build: ./FrontEnd
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    stdin_open: true
    tty: true
    # Não precisa de depends_on backend, mas pode manter
    # A porta 5173 exposta para debug opcional
    ports:
      - "5173:5173"

  nginx:
    image: nginx:alpine  # Versão leve
    container_name: web_nginx
    ports:
      - "80:80"
    volumes:
      - ./BackEnd/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
